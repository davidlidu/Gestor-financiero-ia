<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DeerSystems Financial IA — Gestor de finanzas personales con IA</title>
  <meta name="description" content="DeerSystems Financial IA es una app de Lidutech para gestionar tus ingresos, gastos, metas de ahorro, presupuestos y cuotas, con importación asistida por IA desde las notificaciones bancarias de tu Gmail (solo lectura)." />

  <!-- Modern Typography: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          },
          colors: {
            // Primary palette (used by buttons, accents, etc.)
            primary: {
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            },
            // Modern, vibrant palette
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              400: '#4ade80',
              500: '#22c55e', // Vibrant Green for Income and Primary actions
              600: '#16a34a',
            },
            danger: {
              50: '#fef2f2',
              500: '#ef4444', // Red for Expenses
              600: '#dc2626',
            },
            surface: {
              50: '#ffffff',
              100: '#f8fafc',
              200: '#e2e8f0',
              800: '#1e293b',
              900: '#0f172a',
            }
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.05)',
            'glass-dark': '0 8px 32px 0 rgba(0, 0, 0, 0.3)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Invert calendar icon on dark mode */
    .dark input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
      opacity: 0.7;
      transition: 0.2s;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.5;
      transition: 0.2s;
    }

    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* Fix iOS date input styling */
    input[type="date"] {
      color-scheme: light dark;
    }

    /* Toast slide-in animation */
    @keyframes slideInRight {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Safe area bottom for iOS devices with notch/home indicator */
    .safe-area-bottom {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Custom scrollbar for dark mode */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    /* Shimmer animation for loading bar */
    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(300%);
      }
    }
  </style>
</head>

<body class="bg-slate-900 text-slate-100 antialiased selection:bg-primary-500 selection:text-white">
  <div id="root">
    <!-- Contenido de respaldo visible para navegadores/rastreadores sin JavaScript.
         React lo reemplaza al cargar. Describe el propósito de la app para la verificación. -->
    <noscript>
      <div style="max-width:720px;margin:40px auto;padding:0 20px;font-family:sans-serif;">
        <h1>DeerSystems Financial IA</h1>
        <p>Aplicación de Lidutech para gestionar tus finanzas personales: registra ingresos y gastos,
          crea metas de ahorro, controla presupuestos y cuotas, y visualiza reportes de tu dinero.</p>
        <p>De forma opcional puedes vincular tu cuenta de Google para importar movimientos desde las
          notificaciones bancarias de tu Gmail (acceso de solo lectura; tú revisas y decides qué importar).</p>
        <p><a href="/inicio.html">Conoce más sobre la app</a> ·
          <a href="/privacidad.html">Política de privacidad</a></p>
      </div>
    </noscript>
  </div>

  <script type="module" src="/index.tsx"></script>

</body>

</html>
